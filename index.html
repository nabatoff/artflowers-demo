<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f0ff" />
    <meta name="description" content="ArtFlowers Webshop — оптовый каталог цветов, растений и фурнитуры. Попробуйте, как он работает." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      /* Первая страница начинает грузиться сразу, не дожидаясь остального */
      (function () {
        var l = document.createElement("link");
        l.rel = "preload"; l.as = "image"; l.fetchPriority = "high";
        var q = /[?&]lang=(ru|en)/.exec(location.search), saved = null;
        try { saved = localStorage.getItem("af-demo-lang"); } catch (e) {}
        l.href = "./screens/home-" + ((q ? q[1] : saved) === "en" ? "en" : "ru") + "@s.webp";
        document.head.appendChild(l);
      })();
    </script>
    <title>ArtFlowers Webshop — как это работает</title>
    <script type="module" crossorigin src="./assets/index-O90QwaO3.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-B8MQR8x9.css">
  </head>
  <body>
    <div id="root">
      <!-- Пока грузится презентация, экран не пустой: логотип и полоса загрузки. Содержимое заменяется при запуске -->
      <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:#f3f0ff">
        <img src="./logo.svg" alt="ArtFlowers" width="191" height="40" />
        <div style="width:160px;height:4px;border-radius:4px;background:#dcd6f7;overflow:hidden"><div style="width:40%;height:100%;border-radius:4px;background:#3a4fe0;animation:af-load 1.1s ease-in-out infinite"></div></div>
      </div>
      <style>@keyframes af-load{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}</style>
    </div>
  </body>
</html>
